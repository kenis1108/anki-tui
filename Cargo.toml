[package]
name = "anki-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal Anki client powered by Anki's official scheduler"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
rs-fsrs = { version = "1.2.1", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tui-input = "0.15.4"
unicode-width = "0.2"
