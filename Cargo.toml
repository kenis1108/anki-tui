[package]
name = "anki-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal Anki-like spaced repetition app powered by FSRS"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
dirs = "6.0.0"
hex = "0.4.3"
rand = "0.10.2"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rs-fsrs = { version = "1.2.1", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_tuple = "1.1.3"
sha1 = "0.11.0"
thiserror = "2.0.20"
tui-input = "0.15.4"
unicode-width = "0.2"
zip = { version = "2", features = ["deflate"] }
zstd = "0.13.3"
